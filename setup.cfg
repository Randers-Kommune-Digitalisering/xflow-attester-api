[tool:pytest]
minversion = 7.0
addopts =
    --cov=src tests
    --cov-report=term-missing
pythonpath = src
testpaths = tests
env =
    DEBUG=False
    POD_NAME=no-pod

[pycodestyle]
# autopep8 reads options from [pep8], [pycodestyle], or [flake8] sections
recursive = true
in-place = true
aggressive = 2
ignore = E501,W503,W504

[flake8]
src = src tests
extend-ignore =
    E501,
    W503,
    W504,
    D107,
    D200,
    D204,
    SIM105,
    DOC203,
    ANN101
per-file-ignores =
    __init__.py: D104
    tests/*: D100,D101,D102,D103,SCS108
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    .vscode
show-source = True
# flake8 plugin configs
forbidden-imports =
    *: datetime.datetime, stdlib modules should be imported as a module
    *: typing.Optional, we use T | None instead of Optional[T]
docstring-convention = pep257
style = sphinx
arg-type-hints-in-docstring = False
inline-quotes = "
multiline-quotes = """
docstring-quotes = """
