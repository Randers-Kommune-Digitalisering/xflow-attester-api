services:
  external-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: attester_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d attester_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      FLASK_ENV: prod
      PORT: "8080"
      ATTEST_DB_TYPE: postgres
      ATTEST_DB_HOST: external-postgres
      ATTEST_DB_NAME: attester_db
      ATTEST_DB_USERNAME: user
      ATTEST_DB_PASSWORD: pass
      ATTEST_DB_PORT: "5432"
      SFTP_HOST: "${SFTP_HOST:?Set SFTP_HOST in .env}"
      SFTP_USERNAME: "${SFTP_USERNAME:?Set SFTP_USERNAME in .env}"
      SFTP_HOST_KEY: "${SFTP_HOST_KEY:?Set SFTP_HOST_KEY in .env}"
      SFTP_PASSWORD: "${SFTP_PASSWORD:-}"
    depends_on:
      external-postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
